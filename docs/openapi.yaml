openapi: 3.0.3
info:
  title: Gather POS — Phase 1
  version: 0.1.0
servers:
  - url: /api/v1
components:
  securitySchemes:
    bearerAuth: { type: http, scheme: bearer, bearerFormat: JWT }
    refreshCookie: { type: apiKey, in: cookie, name: pos_refresh }
  schemas:
    Error:
      type: object
      properties:
        error:
          type: object
          properties:
            code: { type: string }
            message: { type: string }
            requestId: { type: string }
paths:
  /health:
    get:
      summary: Database readiness
      responses:
        '200': { description: Database connected }
        '503': { description: Database unavailable }
  /auth/login:
    post:
      summary: Authenticate staff; issue access token and HttpOnly refresh cookie
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              additionalProperties: false
              properties:
                email: { type: string, format: email }
                password: { type: string, format: password, maxLength: 128 }
      responses:
        '200':
          {
            description: 'data contains user, accessToken, expiresIn. Set-Cookie contains rotating refresh token.',
          }
        '400': { description: Invalid input }
        '401': { description: Invalid credentials }
        '429': { description: Sign-in rate limit }
  /auth/refresh:
    post:
      summary: Rotate refresh cookie; replay of a consumed token revokes its session family
      security: [{ refreshCookie: [] }]
      responses:
        '200': { description: New access token and refresh cookie }
        '401': { description: Expired, invalid, disabled, or replayed session }
  /auth/logout:
    post:
      summary: Revoke session and clear cookie; idempotent
      security: [{ refreshCookie: [] }]
      responses:
        '204': { description: Signed out }
  /auth/me:
    get:
      summary: Current identity with current server-side role permissions
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Staff identity }
        '401': { description: Authentication required }
  /staff:
    get:
      summary: Staff directory; requires staff:read
      security: [{ bearerAuth: [] }]
      parameters:
        - in: query
          name: page
          schema: { type: integer, minimum: 1, maximum: 10000, default: 1 }
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
      responses:
        '200':
          { description: 'data array of staff records; pagination contains page, limit, total' }
        '401': { description: Authentication required }
        '403': { description: Permission denied }
